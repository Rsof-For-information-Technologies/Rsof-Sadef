name: Backend CI/CD - Build, Push & Deploy API Only

on:
  push:
    branches: [ "develop" ]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend
  API_SERVICE: api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Sadef.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.run_number }}

      - name: Deploy to VPS (API container only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            echo "Logging into GHCR..."
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /root/sadef/Backend || exit 1

            echo "Pulling latest API image..."
            docker compose pull api

            echo "Restarting only API container..."
            docker compose up -d --no-deps api

            echo "API successfully deployed!"
